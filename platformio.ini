; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200
board_build.flash_size = 4MB
board_build.partitions = min_spiffs.csv

; Pin Web3E at PR #51 head (portal shows device address)
; PR #50 (power-cycle check + opt-in lost-WiFi watchdog) is now merged into master
; TODO: Re-pin to merge commit once https://github.com/AlphaWallet/Web3E/pull/51 merges
lib_deps = 
    https://github.com/AlphaWallet/Web3E.git#bab74cab6600cebfba750d226f7d5df69a712d92
    bblanchon/ArduinoJson@^7.2.1

; Build flags
build_flags = 
    -include src/web3e_flags.h
    -DPROJECT_ID=\"garagedoor\"
    -DAPP_NAME=\"GarageDoor\"
    -DPROXY_BASE_URL=\"https://scriptproxy.percolate.one\"
    -DAP_SSID_PREFIX=\"ESP32-Setup\"

; Generate git version hash at build time
extra_scripts = pre:git_version.py