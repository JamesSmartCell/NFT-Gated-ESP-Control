; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200
board_build.flash_size = 4MB
board_build.partitions = min_spiffs.csv

; Pin Web3E to GitHub master (commit hash from Nov 17, 2026)
lib_deps = 
    https://github.com/AlphaWallet/Web3E.git#ef0ef692902ef7545b00c1f955179f5b4e12c126
    bblanchon/ArduinoJson@^7.2.1

; Build flags
build_flags = 
    -include src/web3e_flags.h
    -DPROJECT_ID=\"garagedoor\"
    -DAPP_NAME=\"GarageDoor\"
    -DPROXY_BASE_URL=\"https://scriptproxy.percolate.one\"
    -DAP_SSID_PREFIX=\"ESP32-Setup\"

; Generate git version hash at build time
extra_scripts = pre:git_version.py